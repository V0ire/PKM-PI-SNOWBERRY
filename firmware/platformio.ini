; Snowberry Smart Greenhouse — ESP32 firmware
; Local-first control.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7.4.2

[env:esp32dev]
build_src_filter = +<*> -<actuator_test.cpp> -<gpio_safe_test.cpp>

[env:measurement]
build_src_filter = +<*> -<actuator_test.cpp> -<gpio_safe_test.cpp>

[env:gpio-safe-test]
build_flags =
    ${env.build_flags}
    -D SNOWBERRY_DIAGNOSTIC_BUILD
build_src_filter = -<*> +<gpio_safe_test.cpp>
lib_deps =
