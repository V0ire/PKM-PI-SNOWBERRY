; Snowberry Smart Greenhouse — ESP32 firmware
; Local-first control. WiFi/Firebase ditambahkan pada tahap integrasi berikutnya.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<actuator_test.cpp>
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    claws/BH1750@^1.3.0

[env:measurement]
extends = env:esp32dev
upload_speed = 115200
build_flags =
    ${env:esp32dev.build_flags}
    -D SNOWBERRY_MEASUREMENT_MODE=1

[env:actuator-test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<actuator_test.cpp>
